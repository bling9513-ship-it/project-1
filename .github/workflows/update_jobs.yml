name: Update Security Jobs

on:
  schedule:
    # 매일 한국 시각 아침 7시 (UTC 22:00)에 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 수동 실행 버튼 지원

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 채용공고 크롤러 실행
        run: |
          python crawler.py

      - name: 변경 사항 Git 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json index.html README.md
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 채용공고 자동 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push
          fi
