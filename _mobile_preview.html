<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모바일 확인용</title>
<style>
  body { margin:0; background:#0b0b0c; font-family:system-ui,sans-serif; }
  .row { display:flex; gap:24px; padding:24px; align-items:flex-start; }
  .frame { width:390px; height:1500px; border:0; border-radius:16px; background:#fff; }
  .label { color:#9ca3af; font-size:12px; margin-bottom:8px; letter-spacing:0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="label">ai.html · 390px</div>
      <iframe class="frame" src="ai.html" width="390" height="1500"></iframe>
    </div>
  </div>
</body>
</html>
