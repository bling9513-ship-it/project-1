<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모바일 확인용</title>
<style>
  body { margin:0; background:#0b0b0c; font-family:system-ui,sans-serif; }
  .row { display:flex; gap:20px; padding:20px; align-items:flex-start; }
  .frame { width:390px; height:900px; border:0; border-radius:14px; background:#fff; }
  .label { color:#9ca3af; font-size:12px; margin-bottom:6px; letter-spacing:0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="label">ai.html · 390px · top</div>
      <iframe class="frame" src="ai.html" width="390" height="900"></iframe>
    </div>
    <div>
      <div class="label">ai.html · 390px · +780px</div>
      <iframe class="frame" src="ai.html" width="390" height="900" onload="try{this.contentWindow.scrollTo(0,780)}catch(e){}"></iframe>
    </div>
    <div>
      <div class="label">ai.html · 390px · bottom</div>
      <iframe class="frame" src="ai.html" width="390" height="900" onload="try{this.contentWindow.scrollTo(0,99999)}catch(e){}"></iframe>
    </div>
  </div>
</body>
</html>
