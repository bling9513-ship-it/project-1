<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecJobs · 정보보안 포지션 큐레이션</title>
  <meta name="description" content="원티드, 점핏, 사람인의 보안 엔지니어 및 분석가 채용공고를 매일 아침 선별해 중복 없이 제공합니다.">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-muted: #e2e8f0;
      
      --border-subtle: #f1f5f9;
      --border-default: #e2e8f0;
      --border-strong: #cbd5e1;
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --accent-primary: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: #eff6ff;
      
      --tag-bg: #f8fafc;
      --tag-border: #e2e8f0;
      --tag-text: #475569;
      
      --wanted-bg: #eff6ff;
      --wanted-text: #2563eb;
      --wanted-border: #bfdbfe;
      
      --jumpit-bg: #ecfdf5;
      --jumpit-text: #059669;
      --jumpit-border: #a7f3d0;
      
      --saramin-bg: #fff7ed;
      --saramin-text: #d97706;
      --saramin-border: #fed7aa;
      
      --urgent-bg: #fef2f2;
      --urgent-text: #dc2626;
      --urgent-border: #fecaca;
      
      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.02);
      --card-shadow-hover: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg-page: #09090b;
      --bg-surface: #18181b;
      --bg-subtle: #27272a;
      --bg-muted: #3f3f46;
      
      --border-subtle: #1f1f23;
      --border-default: #27272a;
      --border-strong: #3f3f46;
      
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      
      --accent-primary: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-subtle: rgba(59, 130, 246, 0.15);
      
      --tag-bg: #27272a;
      --tag-border: #3f3f46;
      --tag-text: #d4d4d8;
      
      --wanted-bg: rgba(37, 99, 235, 0.15);
      --wanted-text: #60a5fa;
      --wanted-border: rgba(37, 99, 235, 0.3);
      
      --jumpit-bg: rgba(16, 185, 129, 0.15);
      --jumpit-text: #34d399;
      --jumpit-border: rgba(16, 185, 129, 0.3);
      
      --saramin-bg: rgba(245, 158, 11, 0.15);
      --saramin-text: #fbbf24;
      --saramin-border: rgba(245, 158, 11, 0.3);
      
      --urgent-bg: rgba(239, 68, 68, 0.15);
      --urgent-text: #f87171;
      --urgent-border: rgba(239, 68, 68, 0.3);
      
      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --card-shadow-hover: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.5;
      letter-spacing: -0.02em;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Global Header */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .curation-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-default);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .update-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .icon-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* Main Container */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* Hero Section */
    .hero {
      margin-bottom: 28px;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .hero-desc {
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
    }

    .stat-chip strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Control Panel (Toolbar) */
    .toolbar {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Search Input */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-page);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      display: none;
    }

    .clear-search-btn:hover {
      color: var(--text-primary);
    }

    /* Keyword Segmented Tabs */
    .segmented-control {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .segmented-control::-webkit-scrollbar {
      display: none;
    }

    .segment-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--bg-page);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      user-select: none;
    }

    .segment-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .segment-btn.active {
      background: var(--text-primary);
      color: var(--bg-surface);
      border-color: var(--text-primary);
      font-weight: 600;
    }

    .segment-btn .count {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.2);
    }

    .segment-btn.active .count {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Sub Filters & View Switcher */
    .sub-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 2px;
    }

    .filter-pill {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg-page);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-pill:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .filter-pill.active {
      background: var(--accent-subtle);
      color: var(--accent-primary);
      border-color: var(--accent-primary);
      font-weight: 600;
    }

    .filter-divider {
      width: 1px;
      height: 14px;
      background: var(--border-default);
      margin: 0 4px;
    }

    .view-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-select {
      padding: 5px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg-page);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      cursor: pointer;
      outline: none;
    }

    .sort-select:focus {
      border-color: var(--accent-primary);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border-default);
      border-radius: 6px;
      overflow: hidden;
    }

    .view-toggle-btn {
      padding: 5px 8px;
      background: var(--bg-page);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .view-toggle-btn:hover {
      color: var(--text-primary);
    }

    .view-toggle-btn.active {
      background: var(--bg-surface);
      color: var(--accent-primary);
      font-weight: 600;
    }

    /* Feed Status Info */
    .feed-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      padding: 0 2px;
    }

    .feed-info strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Job Cards Grid View */
    .jobs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .jobs-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .jobs-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
    }

    .job-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .job-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      box-shadow: var(--card-shadow-hover);
    }

    .job-card:hover .job-title {
      color: var(--accent-primary);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .company-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badges-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .badge-dl {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-dl-urgent {
      background: var(--urgent-bg);
      color: var(--urgent-text);
      border: 1px solid var(--urgent-border);
    }

    .badge-dl-normal {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-default);
    }

    .badge-dl-always {
      background: var(--bg-page);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .badge-platform {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-platform-원티드 {
      background: var(--wanted-bg);
      color: var(--wanted-text);
      border: 1px solid var(--wanted-border);
    }

    .badge-platform-점핏 {
      background: var(--jumpit-bg);
      color: var(--jumpit-text);
      border: 1px solid var(--jumpit-border);
    }

    .badge-platform-사람인 {
      background: var(--saramin-bg);
      color: var(--saramin-text);
      border: 1px solid var(--saramin-border);
    }

    .job-title {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-primary);
      margin-bottom: 14px;
      word-break: keep-all;
      transition: color 0.15s ease;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .keyword-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
    }

    .outlink-indicator {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .job-card:hover .outlink-indicator {
      color: var(--accent-primary);
      transform: translate(2px, -2px);
    }

    /* Compact List View */
    .jobs-list-compact {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    .list-row {
      display: grid;
      grid-template-columns: 140px 1fr 110px 70px 30px;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-subtle);
      text-decoration: none;
      color: inherit;
      transition: background-color 0.12s ease;
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .list-row:hover {
      background: var(--bg-subtle);
    }

    .list-row:hover .list-title {
      color: var(--accent-primary);
    }

    .list-company {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.12s ease;
    }

    .list-deadline {
      font-size: 11.5px;
      text-align: right;
    }

    .list-platforms {
      display: flex;
      gap: 4px;
    }

    .list-outlink {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    @media (max-width: 768px) {
      .list-row {
        grid-template-columns: 1fr auto;
        gap: 6px;
        padding: 12px 14px;
      }
      .list-company {
        font-size: 12px;
        grid-column: 1;
      }
      .list-title {
        font-size: 14px;
        grid-column: 1;
        white-space: normal;
      }
      .list-deadline {
        grid-column: 2;
        grid-row: 1;
      }
      .list-platforms {
        grid-column: 2;
        grid-row: 2;
      }
      .list-outlink {
        display: none;
      }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      color: var(--text-secondary);
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .reset-btn {
      padding: 7px 16px;
      border-radius: 8px;
      background: var(--bg-page);
      border: 1px solid var(--border-default);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
    }

    .reset-btn:hover {
      background: var(--bg-subtle);
    }

    /* Footer */
    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.8;
    }
  </style>
</head>

        </button>

    // Theme Management
    function initTheme() {
      const saved = localStorage.getItem('secjobs-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        setTheme('dark');
      } else {
        setTheme('light');
      }
    }

    function setTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
        localStorage.setItem('secjobs-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
        localStorage.setItem('secjobs-theme', 'light');
      }
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      setTheme(isDark ? 'light' : 'dark');
    });

    // Helper: Clean leading emojis from deadline
    function cleanDeadline(dl) {
      if (!dl) return '상시채용';
      return dl.replace(/^[🚨⚡⏳\s]+/, '').trim();
    }

    function getDeadlineMeta(rawDl) {
      const dl = cleanDeadline(rawDl);
      let badgeClass = 'badge-dl-normal';
      let isUrgent = false;
      let isAlways = false;
      let daysLeft = 999;

      if (dl.includes('D-Day') || dl.includes('D-1') || dl.includes('D-2') || dl.includes('D-3') || dl.includes('오늘') || dl.includes('내일')) {
        badgeClass = 'badge-dl-urgent';
        isUrgent = true;
        const m = dl.match(/D-(\d+)/);
        daysLeft = m ? parseInt(m[1]) : 0;
      } else if (dl.includes('상시') || dl.includes('채용시')) {
        badgeClass = 'badge-dl-always';
        isAlways = true;
        daysLeft = 500;
      } else {
        const m = dl.match(/D-(\d+)/);
        if (m) daysLeft = parseInt(m[1]);
      }

      return { label: dl, badgeClass, isUrgent, isAlways, daysLeft };
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderFeed() {
      // 1. Filter
      let filtered = JOBS.filter(job => {
        if (selectedKeyword !== 'all' && (!job.keywords || !job.keywords.includes(selectedKeyword))) {
          return false;
        }
        if (selectedPlatform !== 'all' && (!job.platforms || !job.platforms.includes(selectedPlatform))) {
          return false;
        }
        const dlMeta = getDeadlineMeta(job.deadline);
        if (selectedDeadline === 'urgent' && !dlMeta.isUrgent) return false;
        if (selectedDeadline === 'always' && !dlMeta.isAlways) return false;

        if (searchTerm) {
          const term = searchTerm.toLowerCase();
          const matchCompany = (job.company || '').toLowerCase().includes(term);
          const matchTitle = (job.title || '').toLowerCase().includes(term);
          const matchKeywords = (job.keywords || []).some(k => k.toLowerCase().includes(term));
          if (!matchCompany && !matchTitle && !matchKeywords) return false;
        }
        return true;
      });

      // 2. Sort
      if (sortBy === 'deadline') {
        filtered.sort((a, b) => {
          const da = getDeadlineMeta(a.deadline).daysLeft;
          const db = getDeadlineMeta(b.deadline).daysLeft;
          return da - db;
        });
      } else if (sortBy === 'company') {
        filtered.sort((a, b) => (a.company || '').localeCompare(b.company || '', 'ko'));
      }

      matchCount.textContent = filtered.length;

      // 3. Render
      if (filtered.length === 0) {
        jobsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">일치하는 채용공고가 없습니다</div>
            <div class="empty-desc">검색어를 변경하거나 적용된 필터를 초기화해 보세요.</div>
            <button class="reset-btn" onclick="resetFilters()">필터 초기화</button>
          </div>
        `;
        return;
      }

      if (currentView === 'grid') {
        let html = '<div class="jobs-grid">';
        filtered.forEach(job => {
          const dlMeta = getDeadlineMeta(job.deadline);
          const dlBadge = `<span class="badge-dl ${dlMeta.badgeClass}">${escapeHtml(dlMeta.label)}</span>`;
          const platformBadges = (job.platforms || []).map(p => 
            `<span class="badge-platform badge-platform-${p}">${p}</span>`
          ).join('');
          const tags = (job.keywords || []).map(k => 
            `<span class="keyword-tag">#${k}</span>`
          ).join('');

          html += `
            <a class="job-card" href="${job.url}" target="_blank" rel="noopener noreferrer">
              <div>
                <div class="card-top">
                  <span class="company-name" title="${escapeHtml(job.company)}">${escapeHtml(job.company)}</span>
                  <div class="badges-row">
                    ${dlBadge}
                    ${platformBadges}
                  </div>
                </div>
                <div class="job-title">${escapeHtml(job.title)}</div>
              </div>
              <div class="card-footer">
                <div class="tags-list">${tags}</div>
                <div class="outlink-indicator">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                  </svg>
                </div>
              </div>
            </a>
          `;
        });
        html += '</div>';
        jobsContainer.innerHTML = html;
      } else {
        let html = '<div class="jobs-list-compact">';
        filtered.forEach(job => {
          const dlMeta = getDeadlineMeta(job.deadline);
          const dlBadge = `<span class="badge-dl ${dlMeta.badgeClass}">${escapeHtml(dlMeta.label)}</span>`;
          const platformBadges = (job.platforms || []).map(p => 
            `<span class="badge-platform badge-platform-${p}">${p}</span>`
          ).join('');

          html += `
            <a class="list-row" href="${job.url}" target="_blank" rel="noopener noreferrer">
              <div class="list-company" title="${escapeHtml(job.company)}">${escapeHtml(job.company)}</div>
              <div class="list-title">${escapeHtml(job.title)}</div>
              <div class="list-deadline">${dlBadge}</div>
              <div class="list-platforms">${platformBadges}</div>
              <div class="list-outlink">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </div>
            </a>
          `;
        });
        html += '</div>';
        jobsContainer.innerHTML = html;
      }
    }

    function resetFilters() {
      selectedKeyword = 'all';
      selectedPlatform = 'all';
      selectedDeadline = 'all';
      searchTerm = '';
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';

      document.querySelectorAll('#keywordNav .segment-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-kw') === 'all'));
      document.querySelectorAll('.filter-pill[data-filter="platform"]').forEach(b => b.classList.toggle('active', b.getAttribute('data-val') === 'all'));
      document.querySelectorAll('.filter-pill[data-filter="deadline"]').forEach(b => b.classList.toggle('active', b.getAttribute('data-val') === 'all'));

      renderFeed();
    }

    // Event Listeners
    document.querySelectorAll('#keywordNav .segment-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#keywordNav .segment-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedKeyword = btn.getAttribute('data-kw');
        renderFeed();
      });
    });

    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const filterType = pill.getAttribute('data-filter');
        const val = pill.getAttribute('data-val');
        document.querySelectorAll(`.filter-pill[data-filter="${filterType}"]`).forEach(p => p.classList.remove('active'));
        pill.classList.add('active');

        if (filterType === 'platform') selectedPlatform = val;
        if (filterType === 'deadline') selectedDeadline = val;
        renderFeed();
      });
    });

    searchInput.addEventListener('input', e => {
      searchTerm = e.target.value.trim();
      clearSearchBtn.style.display = searchTerm ? 'block' : 'none';
      renderFeed();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchTerm = '';
      clearSearchBtn.style.display = 'none';
      renderFeed();
      searchInput.focus();
    });

    sortSelect.addEventListener('change', e => {
      sortBy = e.target.value;
      renderFeed();
    });

    document.getElementById('btnGrid').addEventListener('click', () => {
      currentView = 'grid';
      document.getElementById('btnGrid').classList.add('active');
      document.getElementById('btnList').classList.remove('active');
      renderFeed();
    });

    document.getElementById('btnList').addEventListener('click', () => {
      currentView = 'list';
      document.getElementById('btnList').classList.add('active');
      document.getElementById('btnGrid').classList.remove('active');
      renderFeed();
    });

    // Keyboard shortcut: '/' to focus search, 'Esc' to clear
    window.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        searchTerm = '';
        clearSearchBtn.style.display = 'none';
        renderFeed();
        searchInput.blur();
      }
    });

    // Initialize
    initTheme();
    renderFeed();
  </script>
</body>
</html>
